app:  
  name: MyApplication  
  version: 1.0  
  
database:  
  host: localhost  
  port: 5432  
  username: myuser  
  password: mysecretpassword  
  dbname: mydatabase  
  
server:  
  port: 8080  
  host: 0.0.0.0  
  
logging:  
  level: INFO  
  path: ./logs  
  filename: app.log  
  
cache:  
  enabled: true  
  type: redis  
  host: localhost  
  port: 6379  
  
api_keys:  
  secret_key: my_super_secret_key  
  
mail:  
  host: smtp.example.com  
  port: 587  
  username: yourmail@example.com  
  password: yourmailpassword  
  from: No-Reply <noreply@example.com>  
  
services:  
  external_service_1:  
    url: https://external-service-1.com  
    port: 443  
  external_service_2:  
    url: http://external-service-2.com  
    port: 80  
